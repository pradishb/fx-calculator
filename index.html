<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Money Calc">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f3f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0f10" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Money Calc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a pocket tool — quick, clear, friendly, nothing extra.
   IDEA: the rate board at a money-changer's counter: one row per currency, the big numbers are the point.
   PICTURE: the live board itself — every currency row updating as you type on the keypad.
   COLOUR and TYPE: white board, near-black ink, one vermilion accent for the row you're typing in; Inter Tight, tabular figures.
   LAYOUT: phone first — board on top, keypad pinned below; on wide screens board and keypad sit side by side. */
:root{color-scheme:light dark;
  --bg:light-dark(#f3f3f1,#0f0f10);--card:light-dark(#ffffff,#1b1b1d);--ink:light-dark(#141414,#f2f2f0);
  --mute:light-dark(#6b6b6b,#9a9a9a);--line:light-dark(#e6e6e3,#2a2a2d);--acc:#e8452c;--accSoft:light-dark(#fde9e5,#3a1b16);
  --key:light-dark(#ffffff,#222225);--keyOp:light-dark(#ececea,#2e2e32)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Inter Tight",system-ui,-apple-system,sans-serif;overflow-x:clip;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.app{max-width:980px;margin:0 auto;height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  padding:max(env(safe-area-inset-top),12px) max(env(safe-area-inset-right),14px) max(env(safe-area-inset-bottom),12px) max(env(safe-area-inset-left),14px);gap:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:22px;line-height:1.05;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{font-size:13px;color:var(--mute)}
.pill{min-height:44px;padding:0 16px;border-radius:22px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:15px}
.board{background:var(--card);border-radius:22px;border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;min-height:0}
.row{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:12px;width:100%;text-align:left;
  padding:0 18px;border-top:1px solid var(--line);flex:1 1 0;min-height:0;container-type:size;transition:background .15s}
.row:first-child{border-top:0}
.row.on{background:var(--accSoft)}
.code{width:52px;height:min(40px,70cqh);border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:15px;background:var(--keyOp)}
.row.on .code{background:var(--acc);color:#fff}
.mid{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.val{font-size:clamp(16px,min(42cqh,10cqw),40px);font-weight:600;line-height:1.05;white-space:nowrap;overflow:hidden;max-width:100%;letter-spacing:-.02em}
.nm{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.row.on .nm{color:var(--acc);font-weight:500}
.wan{color:var(--ink);font-weight:600}
@container (max-height:60px){.nm{display:none}}
.keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.k{height:clamp(46px,7.2dvh,68px);border-radius:16px;background:var(--key);border:1px solid var(--line);font-size:24px;font-weight:500}
.k.op{background:var(--keyOp);font-size:26px}
.k.eq{background:var(--acc);color:#fff;border-color:var(--acc)}
.k:active{transform:scale(.96)}
@media(min-width:760px){.app{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);grid-template-rows:auto 1fr;column-gap:20px}
  header{grid-column:1/-1}.side{display:flex;flex-direction:column;justify-content:flex-end}.k{height:clamp(52px,11dvh,84px)}}
/* rates sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:5}
.scrim.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;
  padding:20px 18px max(env(safe-area-inset-bottom),18px)}
@media(min-width:600px){.scrim{align-items:center}.sheet{border-radius:22px}}
.sheet h2{font-size:22px;margin:0 0 4px}
.rr{display:grid;grid-template-columns:36px 52px minmax(0,1fr) auto 44px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);background:var(--card)}
.rr.drag{position:relative;z-index:1;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.grip{min-height:44px;display:grid;place-items:center;color:var(--mute);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.rr.drag .grip{cursor:grabbing;color:var(--acc)}
.rr b{font-size:18px;font-weight:600;white-space:nowrap}
.x{min-height:44px;border-radius:10px;font-size:22px;color:var(--mute)}
.add{margin-top:16px}.add label{display:block;font-weight:600;margin-bottom:6px}
.add input{width:100%}
.sug{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.sug button{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:15px;text-align:left}
.sug b{margin-right:6px}
.add input{min-height:44px;font:inherit;font-size:16px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-transform:none}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{min-height:44px;padding:0 16px;border-radius:12px;background:var(--keyOp);font-weight:600}
.btn.main{background:var(--acc);color:#fff}
.note{font-size:13px;color:var(--mute);margin:6px 0 10px}
.err{color:var(--acc);font-size:13px;min-height:18px;margin-top:6px}
/* No text selection or iOS callouts anywhere, except the search box */
body{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
.row.pressed{background:light-dark(#f6f6f4,#232326)}
.row.on.pressed{background:light-dark(#fbe0d9,#45201a)}
/* long-press menu, styled like iOS's edit menu: frosted, thin dividers, a small pointer */
.menu{--glass:light-dark(rgba(250,250,250,.86),rgba(48,48,52,.86));
  position:fixed;z-index:6;display:flex;border-radius:12px;background:var(--glass);
  -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  box-shadow:0 0 0 .5px light-dark(rgba(0,0,0,.08),rgba(255,255,255,.08)),0 6px 24px rgba(0,0,0,.16)}
.menu::after{content:"";position:absolute;left:var(--tip,50%);top:100%;margin-left:-8px;
  border:8px solid transparent;border-top-color:var(--glass);border-bottom:0}
.menu.below::after{top:auto;bottom:100%;border-top:0;border-bottom:8px solid var(--glass)}
.menu[hidden],.toast[hidden]{display:none}
.menu button{min-height:44px;padding:0 16px;font-size:15px;font-weight:400;color:var(--ink);white-space:nowrap}
.menu button+button{border-left:.5px solid light-dark(rgba(0,0,0,.18),rgba(255,255,255,.18))}
.menu button:first-child{border-radius:12px 0 0 12px}.menu button:last-child{border-radius:0 12px 12px 0}
.menu button:active{background:light-dark(rgba(0,0,0,.08),rgba(255,255,255,.1))}
.menu button:focus-visible{outline-offset:-3px}
.toast{position:fixed;z-index:7;left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);
  display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:20px;
  background:light-dark(rgba(250,250,250,.9),rgba(48,48,52,.9));-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  box-shadow:0 0 0 .5px light-dark(rgba(0,0,0,.08),rgba(255,255,255,.08)),0 6px 24px rgba(0,0,0,.14);
  color:var(--ink);font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(prefers-reduced-motion:reduce){.row,.k{transition:none}.k:active{transform:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div><h1>Money Calc</h1><div class="sub" id="asof"></div></div>
    <button class="pill" id="openRates" aria-label="Currencies and rates">Currencies</button>
  </header>
  <div class="board" id="board" role="list"></div>
  <div class="side">
    <div class="keys" id="keys"></div>
  </div>
</div>

<div class="menu" id="menu" role="menu" hidden>
  <button role="menuitem" id="mCopy">Copy</button>
  <button role="menuitem" id="mPaste">Paste</button>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<div class="scrim" id="scrim">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="rt">
    <h2 id="rt">Currencies</h2>
    <p class="note">What <b>1 USD</b> is worth right now. Rates update automatically. Drag <b aria-hidden="true">≡</b> to change the order.</p>
    <div id="rateList"></div>
    <p class="note" id="sheetStatus"></p>
    <div class="add">
      <label for="find">Add a currency</label>
      <input id="find" placeholder="Type a name or code, e.g. euro or EUR" autocomplete="off" autocorrect="off">
      <div class="sug" id="sug"></div>
      <div class="err" id="err"></div>
    </div>
    <div class="btns">
      <button class="btn" id="refresh">Refresh now</button>
      <button class="btn main" id="done" style="margin-left:auto">Done</button>
    </div>
  </div>
</div>

<script>
{
  // Defaults: mid-market rates per 1 USD, looked up late Nov 2026
  const DEF_DATE = 'Nov 2026';
  const DEFAULTS = [
    {code:'NPR', name:'Nepalese rupee', rate:150.53, dec:2},
    {code:'CNY', name:'Chinese yuan',   rate:6.6659, dec:2},
    {code:'USD', name:'US dollar',      rate:1,      dec:2},
    {code:'IDR', name:'Indonesian rupiah', rate:18355.5, dec:0}
  ];
  const KEY = 'moneycalc.v2';
  const store = {
    get(){ try{ return JSON.parse(localStorage.getItem(KEY)) }catch(e){ return null } },
    set(v){ try{ localStorage.setItem(KEY, JSON.stringify(v)) }catch(e){} }
  };
  const saved = store.get();
  let S = saved && Array.isArray(saved.cur) && saved.cur.length ? saved
        : {cur: DEFAULTS.map(c=>({...c})), active:'USD', expr:'100', asof:DEF_DATE};
  let fresh = true; // next digit replaces the expression

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const save = () => store.set(S);

  // --- safe arithmetic: numbers, + − × ÷, % ---
  function evaluate(src){
    const t = src.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').match(/\d*\.?\d+%?|\d+\.|[+\-*/]/g);
    if(!t) return null;
    const out=[], ops=[], prec={'+':1,'-':1,'*':2,'/':2};
    const apply=()=>{const o=ops.pop(),b=out.pop(),a=out.pop(); if(a===undefined||b===undefined) throw 0;
      out.push(o==='+'?a+b:o==='-'?a-b:o==='*'?a*b:a/b)};
    let expectNum = true;
    for(const x of t){
      if(/[+\-*/]/.test(x)){
        if(expectNum){ if(x==='-'){ out.push(0); } else continue; }
        while(ops.length && prec[ops[ops.length-1]]>=prec[x]) apply();
        ops.push(x); expectNum=true;
      } else { out.push(x.endsWith('%') ? parseFloat(x)/100 : parseFloat(x)); expectNum=false; }
    }
    if(expectNum && ops.length) ops.pop();
    try{ while(ops.length) apply(); }catch(e){ return null }
    const v = out[0];
    return Number.isFinite(v) ? v : null;
  }

  const cur = code => S.cur.find(c=>c.code===code) || S.cur[0];
  let lastGood = 0;
  function activeValue(){ const v = evaluate(S.expr); if(v!==null) lastGood=v; return S.expr==='' ? 0 : (v ?? lastGood); }
  const fmt = (n,dec) => new Intl.NumberFormat(undefined,{minimumFractionDigits:0,maximumFractionDigits:dec}).format(n);
  const hasOp = () => /[+\-−×÷%]/.test(S.expr.replace(/^-/,''));

  // Chinese-style hint: 12,345 -> 1.23万, 184,000,000 -> 1.84亿
  function wan(n){
    const x=Math.abs(n), sign=n<0?'-':'';
    const t=v=>String(Number(v.toFixed(2)));
    return x>=1e8 ? sign+t(x/1e8)+'亿' : x>=1e4 ? sign+t(x/1e4)+'万' : '';
  }
  // shrink a number's font until it fits its row, instead of cutting it off
  function fitVals(){
    document.querySelectorAll('.val').forEach(el=>{
      el.style.fontSize='';
      let f=parseFloat(getComputedStyle(el).fontSize);
      while(el.scrollWidth>el.clientWidth+1 && f>12){ f-=1; el.style.fontSize=f+'px'; }
    });
  }
  const fitRO = new ResizeObserver(()=>fitVals());
  // South Asian hint: 151,200 -> 1.51 lakh, 302,400,000 -> 30.24 crore
  function lakh(n){
    const x=Math.abs(n), sign=n<0?'-':'';
    const t=v=>String(Number(v.toFixed(2)));
    return x>=1e7 ? sign+t(x/1e7)+' crore' : x>=1e5 ? sign+t(x/1e5)+' lakh' : '';
  }
  // Everyone else: 12,500 -> 12.5 thousand, 3,400,000 -> 3.4 million
  function words(n){
    const x=Math.abs(n), sign=n<0?'-':'';
    const t=v=>String(Number(v.toFixed(2)));
    return x>=1e12 ? sign+t(x/1e12)+' trillion' : x>=1e9 ? sign+t(x/1e9)+' billion'
         : x>=1e6 ? sign+t(x/1e6)+' million' : x>=1e3 ? sign+t(x/1e3)+' thousand' : '';
  }
  const LAKH = ['NPR','INR','PKR','BDT'];
  const hintFor = (code,n) => code==='CNY' ? wan(n) : LAKH.includes(code) ? lakh(n) : words(n);
  function render(){
    if(!S.cur.some(c=>c.code===S.active)) S.active = S.cur[0].code;
    const a = cur(S.active), v = activeValue(), usd = v / a.rate;
    $('board').innerHTML = S.cur.map(c=>{
      const on = c.code===S.active;
      const shown = esc(on && hasOp() ? S.expr
                      : on && !fresh && S.expr!=='' ? fmtTyped(S.expr)
                      : fmt(on ? v : usd*c.rate, c.dec));
      const amt = on ? v : usd*c.rate;
      const cn = hintFor(c.code, amt);
      const sub = on && hasOp() ? '= ' + esc(fmt(v,c.dec)) + ' ' + esc(c.code) + (cn ? ' · ' + esc(cn) : '')
                : cn ? '<span class="wan">' + esc(cn) + '</span> · ' + esc(c.name || c.code) : esc(c.name || c.code);
      return `<button class="row${on?' on':''}" role="listitem" data-code="${esc(c.code)}" aria-label="${esc(c.code)}">
        <span class="code">${esc(c.code)}</span>
        <span class="mid"><span class="val">${shown}</span><span class="nm">${sub}</span></span></button>`;
    }).join('');
    fitVals();
    if(typeof showStatus==='function') showStatus(); else $('asof').textContent = 'Rates: ' + (S.asof || DEF_DATE);
    save();
  }
  // show what the user is typing (keeps trailing "." and zeros), with grouping
  function fmtTyped(s){
    const neg = s.startsWith('-'); if(neg) s=s.slice(1);
    const [i,d] = s.split('.');
    const g = new Intl.NumberFormat(undefined).format(Number(i||0));
    const sep = (1.1).toLocaleString().charAt(1);
    return (neg?'-':'') + g + (d!==undefined ? sep + d : '');
  }

  // --- keypad ---
  const KEYS = [['C','op'],['⌫','op'],['%','op'],['÷','op'],
                ['7'],['8'],['9'],['×','op'],
                ['4'],['5'],['6'],['−','op'],
                ['1'],['2'],['3'],['+','op'],
                ['000'],['0'],['.'],['=','eq']];
  $('keys').innerHTML = KEYS.map(([k,c])=>`<button class="k ${c||''}" data-k="${k}" aria-label="${k==='⌫'?'Backspace':k==='C'?'Clear':k}">${k}</button>`).join('');

  function press(k){
    const ops='+−×÷';
    if(k==='C'){ S.expr=''; fresh=false; }
    else if(k==='⌫'){ S.expr = fresh ? '' : S.expr.slice(0,-1); fresh=false; }
    else if(k==='='){ const v=evaluate(S.expr); if(v!==null){ S.expr=trim(v); } fresh=true; }
    else if(ops.includes(k)){
      if(S.expr==='' && k!=='−') return;
      if(ops.includes(S.expr.slice(-1))) S.expr=S.expr.slice(0,-1);
      S.expr+=k; fresh=false;
    }
    else if(k==='%'){ if(/\d$/.test(S.expr)){ S.expr+='%'; fresh=false; } }
    else { // digits and dot
      if(fresh){ S.expr=''; fresh=false; }
      const last = S.expr.split(/[+−×÷]/).pop();
      if(last.endsWith('%')) return;
      if(k==='.'){ if(last.includes('.')) return; if(last==='') k='0.'; }
      if(k==='000' && (last===''||last==='0')) k='0'; // no leading zeros
      if(k==='0' && last==='0') return;
      if(last==='0' && k!=='.' && !k.startsWith('0.')) S.expr=S.expr.slice(0,-1);
      if(last.replace('.','').length + k.replace('.','').length > 14) return;
      S.expr+=k;
    }
    render();
  }
  const trim = v => String(Math.round(v*1e8)/1e8);

  $('keys').addEventListener('click', e=>{ const b=e.target.closest('.k'); if(b) press(b.dataset.k); });
  $('board').addEventListener('click', e=>{
    if(suppressClick){ suppressClick=false; return; } // the tap that ended a long-press
    const r=e.target.closest('.row'); if(!r || r.dataset.code===S.active) return;
    const a=cur(S.active), t=cur(r.dataset.code), v=activeValue();
    const nv = v / a.rate * t.rate;
    S.active=t.code; S.expr = String(Number(nv.toFixed(t.dec))); fresh=true; render();
  });
  // --- copy / paste: long-press a row (or right-click) for a menu; Ctrl/Cmd+C and V also work ---
  // Copies a plain number (1403488.5) so it pastes cleanly into other apps.
  const amountOf = code => {
    const a = cur(S.active), c = cur(code), v = activeValue();
    const n = code===S.active ? v : v / a.rate * c.rate;
    return String(Number(n.toFixed(c.dec)));
  };
  // Reads "1,403,488.50", "1.403.488,50", "Rp 1 403 488" or "$12.5" as a number.
  function parseAmount(text){
    let t = String(text||'').trim().replace(/[\s ']/g,'');
    const neg = /^[-−(]/.test(t) || /^[^\d]*[-−]/.test(t);
    t = t.replace(/[^\d.,]/g,'');
    if(!/\d/.test(t)) return null;
    const dot = t.lastIndexOf('.'), comma = t.lastIndexOf(',');
    if(dot>=0 && comma>=0){ // both: the last one is the decimal mark
      t = dot>comma ? t.replace(/,/g,'') : t.replace(/\./g,'').replace(',','.');
    } else if(comma>=0){ // 1,403,488 is grouping; 12,5 is a decimal
      t = /^\d{1,3}(,\d{3})+$/.test(t) ? t.replace(/,/g,'') : t.replace(/,/g,'.');
    } else if(/^\d{1,3}(\.\d{3}){2,}$/.test(t)){ // 1.403.488
      t = t.replace(/\./g,'');
    }
    if((t.match(/\./g)||[]).length>1) return null;
    const n = Number(t);
    return Number.isFinite(n) ? (neg ? -n : n) : null;
  }
  let toastTimer;
  const CHECK = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="#34c759" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  function toast(msg, ok){
    const el=$('toast'); el.innerHTML=(ok?CHECK:'')+'<span>'+esc(msg)+'</span>'; el.hidden=false;
    // Float at the bottom of the board, just above the keypad.
    const board=$('board').getBoundingClientRect();
    el.style.left=(board.left+board.width/2)+'px'; el.style.top=(board.bottom-el.offsetHeight-12)+'px';
    clearTimeout(toastTimer); toastTimer=setTimeout(()=>{ el.hidden=true; }, 1800);
  }
  async function copyRow(code){
    const text = amountOf(code);
    try{ await navigator.clipboard.writeText(text); toast('Copied ' + text + ' ' + code, true); }
    catch(e){ toast("Couldn't copy"); }
  }
  function pasteInto(code, text){
    const n = parseAmount(text);
    if(n===null){ toast('No number to paste'); return; }
    const c = cur(code);
    S.active = c.code; S.expr = String(Number(n.toFixed(Math.max(c.dec, 8)))); fresh = true;
    if(S.expr.replace(/[-.]/g,'').length > 14){ toast('That number is too long'); return render(); }
    render(); toast('Pasted into ' + c.code, true);
  }
  async function pasteRow(code){
    try{ pasteInto(code, await navigator.clipboard.readText()); }
    catch(e){ toast("Couldn't read the clipboard"); }
  }

  // menuArmed: a press began on the menu itself, so the finger lifting off the
  // row that opened it can't count as tapping a menu button.
  let menuCode = null, pressTimer = null, pressStart = null, suppressClick = false, menuArmed = false;
  function openMenu(row){
    menuCode = row.dataset.code; menuArmed = false;
    row.classList.add('pressed');
    const m = $('menu'), r = row.getBoundingClientRect();
    m.hidden = false;
    const val = row.querySelector('.val').getBoundingClientRect();
    const aim = val.left + val.width/2; // centre the menu over the number
    const left = Math.min(Math.max(8, aim - m.offsetWidth/2), innerWidth - m.offsetWidth - 8);
    m.style.left = left + 'px';
    m.style.setProperty('--tip', Math.min(Math.max(16, aim - left), m.offsetWidth - 16) + 'px');
    // Above the number, clear of the finger; below the row when there's no room.
    const above = val.top - m.offsetHeight - 12;
    m.classList.toggle('below', above < 8);
    m.style.top = (above >= 8 ? above : Math.min(r.bottom + 10, innerHeight - m.offsetHeight - 8)) + 'px';
    $('mCopy').focus({preventScroll:true});
  }
  const closeMenu = () => {
    $('menu').hidden = true; menuCode = null;
    document.querySelectorAll('.row.pressed').forEach(r=>r.classList.remove('pressed'));
  };
  $('board').addEventListener('pointerdown', e=>{
    const row = e.target.closest('.row'); if(!row) return;
    suppressClick = false; pressStart = {x:e.clientX, y:e.clientY};
    clearTimeout(pressTimer);
    pressTimer = setTimeout(()=>{ suppressClick = true; openMenu(row); }, 500);
  });
  $('board').addEventListener('pointermove', e=>{
    if(pressStart && Math.hypot(e.clientX-pressStart.x, e.clientY-pressStart.y) > 10) clearTimeout(pressTimer);
  });
  ['pointerup','pointercancel','pointerleave'].forEach(t=>$('board').addEventListener(t, ()=>clearTimeout(pressTimer)));
  $('board').addEventListener('contextmenu', e=>{ // right-click, and long-press on Android
    const row = e.target.closest('.row'); if(!row) return;
    e.preventDefault(); clearTimeout(pressTimer); suppressClick = true; openMenu(row);
  });
  $('menu').addEventListener('pointerdown', ()=>{ menuArmed = true; });
  const menuItem = action => e => {
    if(e.detail && !menuArmed) return; // e.detail is 0 for Enter/Space, which is fine
    const c = menuCode; closeMenu(); action(c);
  };
  $('mCopy').addEventListener('click', menuItem(copyRow));
  $('mPaste').addEventListener('click', menuItem(pasteRow));
  document.addEventListener('pointerdown', e=>{ if(menuCode && !e.target.closest('#menu')) closeMenu(); }, true);
  document.addEventListener('paste', e=>{
    if($('scrim').classList.contains('open')) return; // pasting into the search box
    e.preventDefault(); pasteInto(S.active, e.clipboardData.getData('text'));
  });

  document.addEventListener('keydown', e=>{
    if(menuCode && e.key==='Escape'){ closeMenu(); return; }
    if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='c' && !$('scrim').classList.contains('open')
       && !String(getSelection())){ e.preventDefault(); copyRow(S.active); return; }
    if($('scrim').classList.contains('open') || e.metaKey || e.ctrlKey) return;
    const map={'*':'×','x':'×','/':'÷','-':'−','+':'+','Enter':'=','=':'=','Backspace':'⌫','Escape':'C','Delete':'C','%':'%','.':'.',',':'.'};
    const k = /^\d$/.test(e.key) ? e.key : map[e.key];
    if(k){ e.preventDefault(); press(k); }
  });

  // --- currencies sheet: rates are read-only; currencies can be added or removed ---
  let names = null;
  try{ names = new Intl.DisplayNames(['en'],{type:'currency'}); }catch(e){}
  const nameOf = code => { try{ const n = names && names.of(code); return n && n!==code ? n : code; }catch(e){ return code; } };
  const COMMON = ['EUR','GBP','JPY','KRW','INR','AUD','SGD','MYR','THB','HKD','TWD','PHP','VND','AED','SAR','CAD','CHF','NZD','BDT','LKR','PKR','QAR','KWD','TRY','RUB','BRL','MXN','ZAR'];
  const rateDigits = r => r>500?0:r>10?2:4;
  function drawRates(){
    $('rateList').innerHTML = S.cur.map((c,i)=>`<div class="rr" data-code="${esc(c.code)}">
      <button class="grip" aria-label="Move ${esc(c.code)}: drag, or use the up and down arrow keys"><svg width="18" height="14" viewBox="0 0 18 14" aria-hidden="true"><path d="M1 1h16M1 7h16M1 13h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <span class="code">${esc(c.code)}</span>
      <span class="nm" style="color:var(--ink)">${esc(c.name||nameOf(c.code))}</span>
      <b>${esc(fmt(c.rate, rateDigits(c.rate)))}</b>
      <button class="x" data-del="${i}" aria-label="Remove ${esc(c.code)}">×</button></div>`).join('');
    $('sheetStatus').textContent = $('asof').textContent;
    suggest();
  }
  function suggest(){
    const q = $('find').value.trim().toLowerCase();
    const pool = S.rates ? Object.keys(S.rates) : COMMON;
    const have = new Set(S.cur.map(c=>c.code));
    let list = pool.filter(c=>/^[A-Z]{3}$/.test(c) && !have.has(c));
    if(q) list = list.filter(c=>c.toLowerCase().includes(q) || nameOf(c).toLowerCase().includes(q));
    else list = COMMON.filter(c=>list.includes(c));
    list.sort((x,y)=>(x.toLowerCase().startsWith(q)?0:1)-(y.toLowerCase().startsWith(q)?0:1));
    $('sug').innerHTML = list.slice(0,8).map(c=>`<button data-add="${esc(c)}"><b>${esc(c)}</b>${esc(nameOf(c))}</button>`).join('')
      || (q ? '<span class="note">No currency matches that.</span>' : '');
  }
  const openSheet = ()=>{ $('find').value=''; $('err').textContent=''; drawRates(); $('scrim').classList.add('open'); };
  const closeSheet = ()=>{ $('scrim').classList.remove('open'); render(); };
  $('openRates').addEventListener('click', openSheet);
  $('done').addEventListener('click', closeSheet);
  $('scrim').addEventListener('click', e=>{ if(e.target.id==='scrim') closeSheet(); });
  $('find').addEventListener('input', ()=>{ $('err').textContent=''; suggest(); });
  $('sug').addEventListener('click', e=>{
    const btn = e.target.closest('[data-add]'); if(!btn) return;
    const code = btn.dataset.add, r = Number(S.rates && S.rates[code]);
    if(!(r>0)){ $('err').textContent = 'Connect to the internet to get the '+code+' rate, then try again.'; live(true).then(drawRates); return; }
    if(S.cur.length>=8){ $('err').textContent='Up to 8 currencies fit on the screen. Remove one first.'; return; }
    S.cur.push({code, name:nameOf(code), rate:r, dec: r>500?0:2});
    $('find').value=''; $('err').textContent=''; save(); drawRates();
  });
  // Reordering: drag a row by its ≡ handle (touch or mouse), or arrow keys on the handle.
  let drag = null;
  const list = $('rateList');
  function applyOrder(focusCode){
    const order = [...list.children].map(r=>r.dataset.code);
    S.cur.sort((a,b)=>order.indexOf(a.code)-order.indexOf(b.code));
    save(); drawRates();
    if(focusCode) list.querySelector(`[data-code="${focusCode}"] .grip`)?.focus();
  }
  list.addEventListener('pointerdown', e=>{
    const g = e.target.closest('.grip'); if(!g || drag) return;
    e.preventDefault();
    const row = g.closest('.rr');
    g.setPointerCapture(e.pointerId);
    drag = {row, id:e.pointerId, y:e.clientY, top:row.offsetTop};
    row.classList.add('drag');
  });
  list.addEventListener('pointermove', e=>{
    if(!drag || e.pointerId!==drag.id) return;
    const {row} = drag, h = row.offsetHeight;
    const top = drag.top + e.clientY - drag.y; // where the dragged row's top should be
    let moved = true;
    while(moved){
      moved = false;
      const prev = row.previousElementSibling, next = row.nextElementSibling;
      if(next && top + h/2 > next.offsetTop + next.offsetHeight/2){ list.insertBefore(next, row); moved = true; }
      else if(prev && top + h/2 < prev.offsetTop + prev.offsetHeight/2){ list.insertBefore(row, prev); moved = true; }
    }
    row.style.transform = `translateY(${top - row.offsetTop}px)`;
  });
  const endDrag = e=>{
    if(!drag || e.pointerId!==drag.id) return;
    drag.row.style.transform = ''; drag.row.classList.remove('drag');
    drag = null; applyOrder();
  };
  list.addEventListener('pointerup', endDrag);
  list.addEventListener('pointercancel', endDrag);
  list.addEventListener('keydown', e=>{
    const g = e.target.closest('.grip'); if(!g || !['ArrowUp','ArrowDown'].includes(e.key)) return;
    e.preventDefault();
    const row = g.closest('.rr');
    const other = e.key==='ArrowUp' ? row.previousElementSibling : row.nextElementSibling;
    if(!other) return;
    if(e.key==='ArrowUp') list.insertBefore(row, other); else list.insertBefore(other, row);
    applyOrder(row.dataset.code);
  });

  $('rateList').addEventListener('click', e=>{
    const i = e.target.dataset.del; if(i===undefined) return;
    if(S.cur.length<=2){ $('err').textContent='Keep at least two currencies.'; return; }
    S.cur.splice(Number(i),1); save(); drawRates();
  });
  $('refresh').addEventListener('click', async ()=>{
    $('refresh').textContent='Refreshing…'; await live(true); drawRates(); $('refresh').textContent='Refresh now';
  });

  // --- Live rates: refreshed on open, when you come back to the app, and hourly ---
  // Two free sources (no key needed); the second is a backup if the first is down.
  const SOURCES = [
    async()=>{ const j=await (await fetch('https://open.er-api.com/v6/latest/USD',{cache:'no-store'})).json();
               if(j && j.result==='success' && j.rates) return j.rates; throw 0; },
    async()=>{ const j=await (await fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json',{cache:'no-store'})).json();
               if(!j || !j.usd) throw 0; const o={}; for(const k in j.usd) o[k.toUpperCase()]=j.usd[k]; return o; }
  ];
  const HOUR = 36e5;
  const when = t => new Date(t).toLocaleString(undefined,{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
  function showStatus(msg){
    if(msg) S.asof = msg;
    else if(S.updated && !offline) S.asof = 'live · ' + when(S.updated);
    $('asof').textContent = 'Rates ' + S.asof;
  }
  let busy = false, offline = false;
  async function live(force){
    if(busy) return;
    if(!force && S.updated && Date.now()-S.updated < 10*60e3) return showStatus();
    busy = true; showStatus(S.updated ? null : 'updating…');
    for(const src of SOURCES){
      try{
        const rates = await src();
        S.cur.forEach(c=>{ const v=Number(rates[c.code]); if(v>0) c.rate=v; });
        S.rates = rates; S.updated = Date.now(); busy=false; offline=false;
        render(); showStatus(); return;
      }catch(e){}
    }
    busy = false; offline = true;
    showStatus(S.updated ? 'offline · last updated ' + when(S.updated) : 'offline · using saved rates');
  }
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) live(); });
  window.addEventListener('online', ()=>live(true));
  setInterval(()=>live(true), HOUR);
  render(); showStatus(); live(true); fitRO.observe($('board'));

  // No pinch zoom: iOS Safari ignores user-scalable=no, but honours this.
  document.addEventListener('gesturestart', e=>e.preventDefault());

  // Offline support (sw.js). Only works when served over http(s), not from a file.
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
}
</script>
</body>
</html>
