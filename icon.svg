  <g transform="translate(256 256) scale(1.3) translate(-256 -256)">
    <rect x="124" y="124" width="264" height="264" rx="64" fill="#e8452c"/>
    <rect x="186" y="210" width="140" height="30" rx="15" fill="#ffffff"/>
    <rect x="186" y="272" width="140" height="30" rx="15" fill="#ffffff"/>
    <circle cx="362" cy="150" r="46" fill="#141414" stroke="#ffffff" stroke-width="8"/>
    <text x="362" y="152" fill="#ffffff" font-family="Inter Tight, Segoe UI, Arial, sans-serif" font-weight="700" font-size="58" text-anchor="middle" dominant-baseline="central">$</text>
  </g>
</svg>
